<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beth Watchlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Rethink+Sans:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f8f7; --card: #ffffff; --ink: #0d1b1d; --muted: #5d6b6c; --line: #e2e8e7;
    --teal: #094C51; --soft: #e8f7f7; --hl: #fff7e0;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0c1213; --card: #141c1d; --ink: #eef3f3; --muted: #9aabab; --line: #243032;
      --teal: #7fd9db; --soft: #16292b; --hl: #2a2412; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  header { padding: 28px 16px 0; max-width: 960px; margin: 0 auto; }
  h1 { font-family: "Rethink Sans", Inter, sans-serif; font-size: 28px; margin: 0; letter-spacing: -0.02em; }
  .sub { color: var(--muted); margin: 4px 0 16px; font-size: 14px; }
  .bar { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); }
  .tabs { display: flex; gap: 4px; }
  .tabs button { font: inherit; font-weight: 600; font-size: 14px; padding: 10px 14px; border: 0; background: none; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs button.on { color: var(--ink); border-bottom-color: var(--teal); }
  .range { display: flex; gap: 6px; padding-bottom: 8px; }
  .range button { font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
  .range button.on { background: var(--teal); color: var(--bg); border-color: var(--teal); }
  main { max-width: 960px; margin: 0 auto; padding: 20px 16px 64px; display: grid; gap: 16px; }
  .item { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 22px; }
  .item h2 { font-family: "Rethink Sans", Inter, sans-serif; font-size: 20px; margin: 0 0 2px; letter-spacing: -0.01em; }
  .meta { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 0 0 14px; }
  .tile { background: var(--soft); border-radius: 12px; padding: 14px; }
  .tile .n { font-family: "Rethink Sans", Inter, sans-serif; font-size: 28px; font-weight: 700; line-height: 1.1; }
  .tile .l { font-size: 12.5px; color: var(--muted); }
  .line { font-size: 13.5px; color: var(--muted); margin: 0 0 12px; }
  .feed { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .feed td { padding: 8px 6px; border-top: 1px solid var(--line); vertical-align: top; }
  .feed tr.hl td { background: var(--hl); }
  .feed .when { white-space: nowrap; color: var(--muted); width: 64px; }
  .feed a, .links a { color: var(--teal); font-weight: 600; text-decoration: none; }
  .links { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; margin-top: 14px; }
  .empty { color: var(--muted); font-size: 14px; margin: 0; }
  details summary { cursor: pointer; color: var(--muted); font-size: 13px; margin: 6px 0; }
  .scroll { overflow-x: auto; }
  h3.sec { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 22px 0 10px; padding-top: 18px; border-top: 1px solid var(--line); }
  .meta + h3.sec { border-top: 0; padding-top: 0; margin-top: 4px; }
  .feed.stats td { white-space: nowrap; }
  .feed tr.th td { color: var(--muted); font-size: 12px; border-top: 0; }
  .muted { color: var(--muted); }
  .small { font-size: 12.5px; }
  .tile .was { font-size: 12px; color: var(--muted); margin-top: 6px; border-top: 1px solid var(--line); padding-top: 6px; }
  .tiles.mini .tile { background: none; border: 1px solid var(--line); padding: 10px 12px; }
  .tiles.mini .n { font-size: 20px; }
</style>
</head>
<body>
<header>
  <h1>Watchlist</h1>
  <p class="sub">What I'm keeping an eye on for you, live from HubSpot. Summary emailed Mondays at 9am.</p>
  <div class="bar">
    <div class="tabs" id="tabs"><button data-tab="campaigns" class="on">Campaigns</button><button data-tab="tools">Tools</button></div>
    <div class="range" id="range"><button data-days="0" class="on">Since start</button><button data-days="7">Last 7 days</button></div>
  </div>
</header>
<main id="main"><p class="empty">Loading…</p></main>
<script>
const fmt = (ms) => new Date(ms).toLocaleDateString("en-GB", { day: "numeric", month: "short" });
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const LABEL = { meeting: "Meeting", deal: "Deal", won: "Won", call: "Call", reply: "Reply" };
let data = null, tab = "campaigns";

async function load(days) {
  document.getElementById("main").innerHTML = '<p class="empty">Loading…</p>';
  data = await (await fetch(`/api/watchlist${days ? `?days=${days}` : ""}`)).json();
  draw();
}
function draw() {
  const main = document.getElementById("main");
  if (data.error) { main.innerHTML = `<p class="empty">Error: ${esc(data.error)}</p>`; return; }
  const list = tab === "tools" ? (data.tools || []).map(tool) : data.items.map(campaign);
  main.innerHTML = list.join("") || '<p class="empty">Nothing here yet.</p>';
}
const links = (it) => `<div class="links">${(it.links || []).map((l) => `<a href="${l.url}" target="_blank" rel="noopener">${esc(l.label)} ↗</a>`).join("")}${(it.cohorts || []).map((c) => `<a href="https://app-eu1.hubspot.com/contacts/25516403/objectLists/${c.listId}/filters" target="_blank" rel="noopener">${esc(c.label)} list ↗</a>`).join("")}</div>`;

function campaign(it) {
  if (it.error) return `<section class="item"><h2>${esc(it.title)}</h2><p class="empty">Error: ${esc(it.error)}</p></section>`;
  const s = it.summary, owners = (it.owners || []).map((o) => o.name.split(" ")[0]).join(" + ");
  const key = it.events.filter((e) => LABEL[e.type]);
  const row = (e) => `<tr class="${["meeting", "deal", "won"].includes(e.type) ? "hl" : ""}"><td class="when">${fmt(e.at)}</td>
    <td><strong>${LABEL[e.type]}</strong></td><td><a href="${e.contactUrl}" target="_blank" rel="noopener">${esc(e.contact)}</a><div class="muted small">${esc(e.text.replace(/^(Meeting booked|Deal opened|Closed won|Call logged by|Replied to a sales email)[: ]*/, ""))}</div></td></tr>`;
  const cs = it.cohortSizes, reg = cs["Registered"], att = cs["Attended (name-matched)"];
  const pct = (a, b) => (b ? Math.round((100 * a) / b) + "%" : "–");
  const tile = (n, l) => `<div class="tile"><div class="n">${n}</div><div class="l">${l}</div></div>`;
  const emails = (it.emailStats || []).filter((e) => !e.error);
  const ct = it.callTasks;
  return `<section class="item">
    <h2>${esc(it.title)}</h2>
    <p class="meta">Since ${fmt(it.sinceMs)} · ${it.totalContacts} people</p>

    <h3 class="sec">Meetings &amp; deals</h3>
    <div class="tiles">${tile(s.meetingsWithOwners, `Meetings with ${esc(owners)}`)}${tile(s.deals, "Deals opened")}${tile(s.won, "Closed won")}${tile(pct(s.replies, it.totalContacts), "Replied")}</div>
    ${key.length ? `<details ${key.length <= 6 ? "open" : ""}><summary>Who (${key.length})</summary><div class="scroll"><table class="feed">${key.map(row).join("")}</table></div></details>` : '<p class="empty">Nothing yet.</p>'}

    ${reg != null ? `<h3 class="sec">Webinar</h3>
    <div class="tiles">${tile(reg, "Signed up")}${att != null ? tile(att, "Attended") + tile(pct(att, reg), "Show-up rate") : ""}</div>
    ${att != null ? `<p class="line">Attended is matched from Zoom names, so it's approximate.</p>` : ""}` : ""}

    ${emails.length ? `<h3 class="sec">Emails</h3>
    <div class="scroll"><table class="feed stats"><tr class="th"><td>Email</td><td>Sent</td><td>Opened</td><td>Clicked</td><td>Unsubs</td></tr>
    ${emails.map((e) => `<tr><td><a href="${e.url}" target="_blank" rel="noopener">${esc(e.label)}</a></td>${e.sent ? `<td>${e.sent.toLocaleString()}</td><td>${pct(e.opens, e.delivered)}</td><td>${pct(e.clicks, e.delivered)}</td><td>${pct(e.unsubscribed, e.delivered)}</td>` : '<td colspan="4" class="muted">No stats yet</td>'}</tr>`).join("")}
    </table></div>` : ""}

    ${it.callTasks !== undefined ? `<h3 class="sec">Call tasks</h3>
    ${ct ? `<div class="tiles">${tile(ct.total, "Tasks")}${tile(ct.done, "Done")}${tile(pct(ct.done, ct.total), "Completed")}</div>
      <table class="feed">${ct.byOwner.map((o) => `<tr><td>${esc(o.name)}</td><td>${o.done} done · ${o.open} open</td></tr>`).join("")}</table>`
      : `<p class="empty">${esc(it.callTasksNote || (it.callTasksConfig && it.callTasksConfig.note) || "Not started yet.")}</p>`}` : ""}

    <h3 class="sec">Other activity</h3>
    <div class="tiles mini">${tile(s.calls, `Calls by ${esc(owners)}`)}${tile(s.formFills, "Form fills")}${tile(s.visitors, "Site visitors")}${tile(pct(it.unsubscribed, it.totalContacts), "Unsubscribed")}</div>
    ${links(it)}
  </section>`;
}

function tool(t) {
  if (t.type === "complete-post-purchase") return completePP(t);
  if (t.error) return `<section class="item"><h2>${esc(t.title)}</h2><p class="empty">Error: ${esc(t.error)}</p></section>`;
  return `<section class="item">
    <h2>${esc(t.title)}</h2>
    <p class="meta">Since ${fmt(t.sinceMs)}</p>
    <div class="tiles">
      <div class="tile"><div class="n">${t.viaTool}</div><div class="l">Tickets created via tool</div></div>
      <div class="tile"><div class="n">${t.manual}</div><div class="l">Tickets via manual form</div></div>
      <div class="tile"><div class="n">${t.adoption}%</div><div class="l">Share using the tool</div></div>
      <div class="tile"><div class="n">${t.people.filter((p) => p.tool).length}</div><div class="l">Consultants creating tickets</div></div>
    </div>
    ${t.people.length ? `<details open><summary>By consultant</summary><table class="feed">${t.people.map((p) => `<tr><td>${esc(p.name)}</td><td>${p.tool} via tool · ${p.manual} manual</td></tr>`).join("")}</table></details>` : ""}
    ${links(t)}
  </section>`;
}

function completePP(t) {
  if (t.error) return `<section class="item"><h2>${esc(t.title)}</h2><p class="empty">Error: ${esc(t.error)}</p></section>`;
  const c = t.current, b = t.baseline, v = (x, suf = "%") => (x == null ? "–" : x + suf);
  const cmp = (now, was, label, suf = "%") => `<div class="tile"><div class="n">${v(now, suf)}</div><div class="l">${label}</div><div class="was">Before: ${v(was, suf)}</div></div>`;
  const pct = (a, d) => (d ? Math.round((100 * a) / d) + "%" : "–");
  return `<section class="item">
    <h2>${esc(t.title)}</h2>
    <p class="meta">Live since ${fmt(t.sinceMs)} · ${c.buyers} buyers since (${b.buyers} in the baseline, Aug to launch) · first ${t.windowDays} days after purchase</p>
    <h3 class="sec">Getting set up</h3>
    <div class="tiles">${cmp(c.formPct, b.formPct, "Lettings form received")}${cmp(c.medianDaysToForm, b.medianDaysToForm, "Days to form (median)", "")}</div>
    <h3 class="sec">Who helped them</h3>
    <div class="tiles">${cmp(c.icTouchPct, b.icTouchPct, "Needed their IC")}${cmp(c.lettingsTouchPct, b.lettingsTouchPct, "Handled by Lettings")}${cmp(c.supportTouchPct, b.supportTouchPct, "Support / ticket")}${cmp(c.emailedInPct, b.emailedInPct, "Emailed us")}</div>
    <p class="line">Goal: IC % down, Lettings and form % up.${c.stillInWindow ? ` ${c.stillInWindow} of the ${c.buyers} new buyers are still inside their ${t.windowDays} days, so these will move.` : ""}</p>
    ${(t.emailStats || []).filter((e) => !e.error).length ? `<h3 class="sec">Emails</h3><table class="feed stats"><tr class="th"><td>Email</td><td>Sent</td><td>Opened</td><td>Clicked</td></tr>
      ${t.emailStats.filter((e) => !e.error).map((e) => `<tr><td>${esc(e.label)}</td>${e.sent ? `<td>${e.sent}</td><td>${pct(e.opens, e.delivered)}</td><td>${pct(e.clicks, e.delivered)}</td>` : '<td colspan="3" class="muted">No stats yet</td>'}</tr>`).join("")}</table>` : ""}
    ${links(t)}
  </section>`;
}

document.getElementById("range").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  document.querySelectorAll("#range button").forEach((x) => x.classList.toggle("on", x === b));
  load(Number(b.dataset.days));
});
document.getElementById("tabs").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  tab = b.dataset.tab;
  document.querySelectorAll("#tabs button").forEach((x) => x.classList.toggle("on", x === b));
  if (data) draw();
});
load(0);
</script>
</body>
</html>
