<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Growth Reports</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rethink+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
  /* Redesign 18 Nov: white SaaS look, GetGround teal + purple, Rethink Sans headings / Inter body. */
  :root {
    color-scheme: light;
    --surface-1: #ffffff;
    --page-plane: #f6f8fa;
    --text-primary: #0d1f24;
    --text-secondary: #4a5b63;
    --text-muted: #8593a0;
    --gridline: #eef1f4;
    --baseline: #d6dce2;
    --border: #e6ebef;
    --good: #13a6aa;
    --warning: #f2a516;
    --serious: #ef7a5c;
    --critical: #e5484d;
    --series-1: #18b8bc; --series-2: #7b5cf0; --series-3: #094c51; --series-4: #b39dff;
    --series-5: #5fd4d7; --series-6: #f2a516; --series-7: #4c3fb3; --series-8: #ef7a5c;
    --not-done: #e3e8ed;
    --accent-soft: rgba(24,184,188,0.10);
    --teal: #18b8bc; --teal-ink: #094c51; --purple: #7b5cf0; --purple-soft: rgba(123,92,240,0.10);
    --shadow: 0 1px 2px rgba(16,24,40,0.04), 0 6px 20px rgba(16,24,40,0.05);
    --head-font: "Rethink Sans", "Inter", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --surface-1: #131b1f;
      --page-plane: #0a1013;
      --text-primary: #eef4f5;
      --text-secondary: #a9b7bd;
      --text-muted: #74848c;
      --gridline: #1e292e;
      --baseline: #2d3a40;
      --border: #22303a;
      --good: #35c9cc;
      --warning: #f2b33d;
      --serious: #f08f74;
      --critical: #ef6a6e;
      --series-1: #35c9cc; --series-2: #9a82ff; --series-3: #7fe3e5; --series-4: #c5b5ff;
      --series-5: #1f8d91; --series-6: #f2b33d; --series-7: #6d5ce0; --series-8: #f08f74;
      --not-done: #24323a;
      --accent-soft: rgba(53,201,204,0.14);
      --teal: #35c9cc; --teal-ink: #7fe3e5; --purple: #9a82ff; --purple-soft: rgba(154,130,255,0.16);
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 20px rgba(0,0,0,0.25);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page-plane); color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    padding: 20px clamp(16px, 4vw, 40px);
    display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
  }
  /* Navigation (18 Nov): Watchlist-style section tabs, then a row of sub-tabs for that section. */
  header { flex-direction: column; align-items: stretch; gap: 0; padding-bottom: 0; }
  #campaign-nav { max-width: calc(1000px - 2 * clamp(16px, 4vw, 40px)); width: 100%; margin: 0 auto; }
  #campaign-nav .tabs:first-child a:first-child { padding-left: 0; }
  .tabs-row { display: flex; align-items: flex-end; gap: 8px; min-width: 0; }
  .tabs { display: flex; gap: 4px; overflow-x: auto; min-width: 0; scrollbar-width: thin; }
  .tabs a { white-space: nowrap; font-weight: 600; font-size: 14px; padding: 10px 14px; text-decoration: none;
    color: var(--text-muted); border-bottom: 2px solid transparent; display: inline-flex; align-items: center; gap: 6px; }
  .tabs a:hover { color: var(--text-primary); }
  .tabs a.on { color: var(--text-primary); border-bottom-color: var(--series-1); }
  .tabs a .count { font-size: 11px; font-weight: 600; color: var(--text-muted); background: var(--accent-soft); border-radius: 999px; padding: 1px 7px; }
  /* Sub-nav (18 Nov): one line per group, chips wrap — nothing hidden behind a sideways scroll. */
  .subnav { border-top: 1px solid var(--border); padding: 10px 0 12px; display: flex; flex-direction: column; gap: 8px; }
  .sub-group { display: grid; grid-template-columns: 170px 1fr; gap: 10px; align-items: center; }
  @media (max-width: 700px) { .sub-group { grid-template-columns: 1fr; gap: 4px; } }
  .sub-group .grp { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); }
  .sub-items { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .sub-items a { font-size: 13px; padding: 5px 11px; border-radius: 999px; text-decoration: none; color: var(--text-secondary);
    border: 1px solid var(--border); display: inline-flex; align-items: center; gap: 6px; }
  .sub-items a:hover { border-color: var(--series-1); color: var(--text-primary); }
  .sub-items a.on { color: var(--text-primary); background: var(--accent-soft); border-color: var(--series-1); font-weight: 600; }
  .subnav details.nav-closed { position: relative; }
  .subnav details.nav-closed summary { list-style: none; cursor: pointer; font-size: 13px; padding: 5px 11px; border-radius: 999px;
    color: var(--text-muted); border: 1px dashed var(--baseline); white-space: nowrap; user-select: none; }
  .subnav details.nav-closed summary::-webkit-details-marker { display: none; }
  .subnav details.nav-closed summary::after { content: " ▾"; font-size: 10px; }
  .subnav details.nav-closed summary.active { color: var(--text-primary); border-style: solid; border-color: var(--series-1); background: var(--accent-soft); font-weight: 600; }
  .subnav .nav-closed-menu a { display: block; font-size: 13px; padding: 7px 10px; border-radius: 6px; text-decoration: none; color: var(--text-secondary); border: 0; }
  .subnav .nav-closed-menu a:hover, .subnav .nav-closed-menu a.on { background: var(--accent-soft); color: var(--text-primary); }
  .calls-view #emails-slot, .calls-view #assets-slot { display: none; }
  .pick-hint { color: var(--text-muted); font-size: 14px; text-align: center; padding: 48px 0; }
  .ov-hero { background: var(--surface-1); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow); padding: 24px 26px; margin-bottom: 20px;
    background-image: radial-gradient(1200px 200px at 0% 0%, var(--accent-soft), transparent 60%), radial-gradient(800px 200px at 100% 0%, var(--purple-soft), transparent 60%); }
  .ov-hero h1 { margin: 0 0 6px; font-size: 26px; font-weight: 800; }
  .ov-hero > p { margin: 0 0 18px; color: var(--text-secondary); font-size: 14px; line-height: 1.5; max-width: 720px; }
  .flow { display: flex; align-items: stretch; gap: 6px; flex-wrap: wrap; }
  .flow-step { flex: 1 1 140px; background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; position: relative; overflow: hidden; }
  .flow-step::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--c); }
  .flow-step .k { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); }
  .flow-step .v { font-family: var(--head-font); font-size: 28px; font-weight: 800; letter-spacing: -0.02em; margin: 4px 0 2px; }
  .flow-step .v small { font-size: 15px; color: var(--text-muted); font-weight: 600; }
  .flow-step .s { font-size: 12px; color: var(--text-secondary); }
  .flow-arrow { align-self: center; color: var(--baseline); font-size: 18px; }
  @media (max-width: 700px) { .flow-arrow { display: none; } }
  .ld { color: var(--text-muted); }
  table.ov-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.ov-table th { text-align: left; font-weight: 600; color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  table.ov-table td { padding: 10px; border-bottom: 1px solid var(--gridline); vertical-align: middle; }
  table.ov-table .num { text-align: right; font-variant-numeric: tabular-nums; }
  table.ov-table a { color: var(--teal-ink); text-decoration: none; font-weight: 500; }
  table.ov-table .muted, .muted { color: var(--text-muted); font-size: 12px; }
  .small { font-size: 12px; }
  .nowrap { white-space: nowrap; }
  .cellbar { display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .cellbar .mini { width: 70px; height: 6px; border-radius: 999px; background: var(--not-done); overflow: hidden; display: inline-block; }
  .cellbar .mini i { display: block; height: 100%; background: linear-gradient(90deg, var(--teal), var(--purple)); }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .card-head a { font-size: 13px; color: var(--teal-ink); text-decoration: none; font-weight: 600; }
  .web-pages { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin: 12px 0 8px; }
  .wp { border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
  .wp .k { font-size: 12px; color: var(--text-muted); } .wp .v { font-family: var(--head-font); font-size: 24px; font-weight: 800; } .wp .s { font-size: 11px; color: var(--text-muted); }
  .ov-h4 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin: 16px 0 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  a.chip { font-size: 13px; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--border); text-decoration: none; color: var(--text-primary); }
  .home-panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; align-items: start; }
  .home-panel { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px 10px; }
  a.home-panel-head { display: block; font-size: 16px; font-weight: 700; color: var(--text-primary); text-decoration: none; margin-bottom: 6px; }
  a.home-panel-head:hover { color: var(--series-1); }
  .home-grp { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); margin: 12px 0 2px; }
  a.home-row { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-top: 1px solid var(--border); text-decoration: none; color: var(--text-primary); font-size: 14px; }
  .home-grp + a.home-row { border-top: 0; }
  a.home-row:hover .nm { color: var(--series-1); }
  a.home-row .nm { flex: 1; min-width: 0; }
  a.home-row .left { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
  .group-heading { font-size: 13px; font-weight: 600; color: var(--text-secondary); margin: 22px 0 10px; }
    color: var(--text-muted); border: 1px dashed var(--baseline); white-space: nowrap; user-select: none; }
  .overview-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 8px; }
  a.overview-tile { display: block; background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; text-decoration: none; color: inherit; }
  a.overview-tile:hover, a.landing-card:hover { border-color: var(--series-1); }
  a.overview-tile .label { font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-muted); }
  a.overview-tile .value { font-size: 30px; font-weight: 700; margin: 4px 0 2px; }
  a.overview-tile .sub { font-size: 12px; color: var(--text-secondary); }
  .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 28px 0 10px; }
  .section-head .section-heading { margin: 0; }
  .section-head a { font-size: 13px; color: var(--series-1); text-decoration: none; }
  details.closed-list { margin-top: 28px; }
  details.closed-list summary { cursor: pointer; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px; }
  header .brand { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  header h1 a { color: inherit; text-decoration: none; }
  .priority-pill {
    font-size: 10px; font-weight: 700; letter-spacing: 0.02em; text-transform: uppercase;
    padding: 2px 7px; border-radius: 999px; white-space: nowrap; line-height: 1.4;
  }
  .priority-pill.high { color: #fff; background: var(--critical); }
  .priority-pill.medium { color: #3a2a06; background: var(--warning); }
  .priority-pill.low { color: var(--text-secondary); background: var(--baseline); }
  .priority-pill.none { color: var(--text-muted); background: transparent; border: 1px solid var(--border); }
  .priority-pill.closed { color: var(--text-muted); background: transparent; border: 1px solid var(--baseline); }
  /* Closed campaigns: one "Closed (n)" dropdown in the nav instead of a pill each. */
  .nav-closed-menu {
    position: absolute; top: calc(100% + 6px); left: 0; z-index: 10; min-width: 240px; max-width: calc(100vw - 32px);
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 6px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.12); display: flex; flex-direction: column; gap: 2px;
  }
  .section-heading {
    font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--text-muted); margin: 28px 0 10px;
  }
  .section-heading:first-of-type { margin-top: 0; }
  a.landing-card.closed { background: transparent; border-style: dashed; }
  a.landing-card.closed h3 { color: var(--text-secondary); font-weight: 500; }
  a.landing-card.closed p { display: none; }
  .closed-banner {
    font-size: 13px; color: var(--text-secondary); border: 1px dashed var(--baseline); border-radius: 10px;
    padding: 10px 14px; margin-bottom: 20px;
  }
  .scope-note { margin: 0; font-size: 12px; color: var(--text-muted); white-space: nowrap; }
  @media (max-width: 700px) { .scope-note { white-space: normal; } }
  main { max-width: 1000px; margin: 0 auto; padding: 24px clamp(16px, 4vw, 40px) 64px; }
  /* Status line on top, date bar always on its own row underneath — same spot whatever range is picked. */
  .meta-row {
    display: flex; flex-direction: column; align-items: flex-start; gap: 10px;
    margin-bottom: 20px;
  }
  .meta-row p { margin: 0; color: var(--text-secondary); font-size: 13px; }
  button#update-btn, .back-link {
    font: inherit; font-size: 13px; padding: 7px 14px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary);
    text-decoration: none; display: inline-block;
  }
  button#update-btn:active { transform: translateY(1px); }
  .landing-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 16px;
  }
  a.landing-card {
    display: block; background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px;
    padding: 18px 20px; text-decoration: none; color: inherit;
  }
  a.landing-card h3 { margin: 0; font-size: 15px; font-weight: 600; }
  a.landing-card .landing-card-head {
    display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 6px;
  }
  a.landing-card p { margin: 0 0 12px; font-size: 13px; color: var(--text-secondary); line-height: 1.5; }
  a.landing-card .landing-stats { font-size: 12px; color: var(--text-muted); display: flex; gap: 12px; }
  section.card {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px;
    padding: 20px clamp(16px, 3vw, 28px); margin-bottom: 20px;
  }
  section.card h2 { font-size: 16px; margin: 0 0 4px; font-weight: 600; }
  section.card .sub { font-size: 13px; color: var(--text-muted); margin: 0 0 18px; }
  .email-block { padding: 14px 0; border-top: 1px solid var(--border); }
  .email-block:first-of-type { border-top: none; padding-top: 0; }
  .email-title { font-size: 13px; color: var(--text-muted); }
  .email-name { font-size: 12px; }
  .email-subject { font-size: 16px; font-weight: 600; margin-top: 4px; }
  .email-preview { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
  .email-stats { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; margin-top: 10px; }
  .email-stats .share { color: var(--text-muted); margin-left: 2px; }
  .email-body { margin-top: 10px; font-size: 13px; }
  .email-body summary { cursor: pointer; color: var(--text-muted); }
  .email-body div { white-space: pre-wrap; margin-top: 8px; padding: 12px; border-left: 3px solid var(--border); line-height: 1.5; }
  .context-line { font-size: 13px; color: var(--text-secondary); line-height: 1.5; margin: 0 0 18px; }
  .task-name-pattern { font-size: 12px; color: var(--text-muted); margin: -10px 0 18px; }
  .task-name-pattern code {
    font-family: ui-monospace, "SF Mono", Menlo, monospace; background: var(--accent-soft);
    color: var(--text-primary); padding: 1px 6px; border-radius: 4px; font-size: 11.5px;
  }
  .task-name-note { font-style: italic; }
  .stat-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .stat-tile {
    flex: 1 1 120px; border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px;
  }
  .stat-tile .label { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
  .stat-tile .value { font-size: 26px; font-weight: 600; font-variant-numeric: proportional-nums; }
  .stat-tile.done .value { color: var(--good); }
  .stat-tile.priority .value { font-size: 18px; font-weight: 700; }
  .stat-tile.priority.high .value { color: var(--critical); }
  .stat-tile.priority.medium .value { color: var(--warning); }
  .stat-tile.priority.low .value { color: var(--text-muted); }
  .rep-bar-wrap { margin-bottom: 14px; }
  .rep-bar-head {
    display: flex; justify-content: space-between; font-size: 13px; color: var(--text-secondary);
    margin-bottom: 6px;
  }
  .rep-bar {
    height: 10px; border-radius: 5px; background: var(--not-done); overflow: hidden; display: flex;
  }
  .rep-bar .done-seg { background: var(--good); height: 100%; }
  .rep-task-link {
    display: inline-block; margin-top: 6px; font-size: 12px; color: var(--series-1);
    text-decoration: none;
  }
  .rep-task-link:hover { text-decoration: underline; }
  .legend-row { display: flex; gap: 16px; font-size: 12px; color: var(--text-secondary); margin-top: 12px; }
  .legend-swatch { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .empty-state {
    padding: 28px 16px; text-align: center; color: var(--text-muted); font-size: 13px;
    border: 1px dashed var(--gridline); border-radius: 10px;
  }
  .overflow-x { overflow-x: auto; }
  table.number-table, table.outcomes-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 4px; }
  table.number-table th, table.number-table td,
  table.outcomes-table th, table.outcomes-table td {
    text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--gridline);
  }
  table.number-table th, table.outcomes-table th { color: var(--text-muted); font-weight: 500; }
  table.number-table td.left-to-do { font-weight: 600; }
  table.number-table td.left-to-do.has-left { color: var(--serious); }
  .outcome-bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .outcome-bar-row .name {
    flex: 0 0 160px; font-size: 13px; color: var(--text-secondary); cursor: help;
    border-bottom: 1px dashed var(--baseline); width: fit-content;
  }
  .outcome-bar-row .name, .outcome-bar-row .count { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .outcome-bar-row .track { flex: 1; height: 10px; border-radius: 5px; background: var(--gridline); overflow: hidden; }
  .outcome-bar-row .fill { height: 100%; border-radius: 5px; }
  .outcome-bar-row .count { flex: 0 0 84px; text-align: right; font-size: 13px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .outcome-bar-row .count .share { color: var(--text-muted); margin-left: 6px; display: inline-block; min-width: 34px; }
  .outcome-bar-row .bench { flex: 0 0 40px; text-align: right; font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums; border-left: 1px solid var(--baseline); padding-left: 6px; cursor: help; }
  .meta-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .range-ctl { display: flex; align-items: center; gap: 8px; font-size: 13px; flex-wrap: wrap; }
  .meta-actions, .range-ctl, .range-pills { min-width: 0; max-width: 100%; }
  .range-pills { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-1); }
  .range-pill {
    font: inherit; font-size: 13px; padding: 5px 10px; border-radius: 7px; border: 0; cursor: pointer;
    background: transparent; color: var(--text-secondary); white-space: nowrap;
  }
  .range-pill:hover { color: var(--text-primary); background: var(--gridline); }
  .range-pill.active { background: var(--text-primary); color: var(--surface-1); }
  .range-dates { display: inline-flex; align-items: center; gap: 6px; }
  .range-ctl input {
    font: inherit; font-size: 13px; padding: 6px 8px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary);
  }
  .stat-tile.neg .value { color: var(--critical); }
  .stat-tile.warn .value { color: var(--warning); }
  .mtg-table-wrap { overflow-x: auto; }
  .mtg-table { width: 100%; border-collapse: collapse; font-size: 13px; }

  /* ---- Redesign layer (18 Nov) ---- */

  .brandbar .mark { width: 26px; height: 26px; border-radius: 8px; background: linear-gradient(135deg, var(--teal), var(--purple)); box-shadow: 0 4px 12px rgba(123,92,240,0.25); }

  }

  .priority-pill.high { color: #c2272d; background: #fdecec; }

  #contact-popover { border-radius: 12px; box-shadow: 0 12px 32px rgba(16,24,40,0.14); }

  /* Home */
  .home-hero { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 18px; }
  a.hero-tile { display: block; text-decoration: none; color: inherit; border-radius: 16px; padding: 18px 20px; border: 1px solid var(--border); background: var(--surface-1); box-shadow: var(--shadow); position: relative; overflow: hidden; }

  /* Section identity (18 Nov): Campaigns = teal overview, Call tasks = purple task detail. */
  body[data-sec="campaigns"] { --sec: var(--teal); --sec-ink: var(--teal-ink); --sec-soft: var(--accent-soft); }
  body[data-sec="calls"] { --sec: var(--purple); --sec-ink: var(--purple); --sec-soft: var(--purple-soft); }
  body[data-sec="home"] { --sec: var(--teal); --sec-ink: var(--teal-ink); --sec-soft: var(--accent-soft); }
  .tabs a.on { color: var(--sec-ink); border-bottom-color: var(--sec); }
  body[data-sec="calls"] header { background: linear-gradient(180deg, var(--surface-1), color-mix(in srgb, var(--purple) 5%, var(--surface-1))); }
  body[data-sec="campaigns"] header { background: linear-gradient(180deg, var(--surface-1), color-mix(in srgb, var(--teal) 5%, var(--surface-1))); }
  /* Sub-nav groups as separate boxes. */
  .subnav { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; padding: 12px 0 14px; }
  .sub-group { display: flex; flex-direction: column; gap: 8px; align-items: stretch; background: var(--surface-1); border: 1px solid var(--border); border-top: 3px solid var(--sec); border-radius: 12px; padding: 10px 12px 12px; }
  .sub-group .grp { color: var(--sec-ink); }

  @media (max-width: 700px) { .sub-group { grid-template-columns: none; } }

  /* Overview funnel + meetings (18 Nov v2) */
  .funnel { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
  .fn-row { display: grid; grid-template-columns: 150px 110px 1fr; grid-template-areas: "k v bar" "k v s"; column-gap: 18px; row-gap: 2px; align-items: center; padding: 12px 14px; border-radius: 12px; background: var(--surface-1); border: 1px solid var(--border); }
  .fn-k { grid-area: k; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-secondary); display: flex; align-items: center; gap: 8px; }
  .fn-k::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--c); flex: none; }
  .fn-v { grid-area: v; font-family: var(--head-font); font-size: 28px; font-weight: 800; letter-spacing: -0.02em; text-align: right; }
  .fn-bar { grid-area: bar; height: 10px; border-radius: 999px; background: var(--gridline); overflow: hidden; }
  .fn-bar i { display: block; height: 100%; border-radius: 999px; background: var(--c); transition: width .4s; }
  .fn-s { grid-area: s; font-size: 12px; color: var(--text-secondary); }
  @media (max-width: 700px) { .fn-row { grid-template-columns: 1fr auto; grid-template-areas: "k v" "bar bar" "s s"; } }
  .ov-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }
  .ov-grid > section.card { margin: 0; }

  @media (max-width: 800px) { .ov-grid { grid-template-columns: 1fr; } }
  .mt-bar { display: flex; height: 14px; border-radius: 999px; overflow: hidden; gap: 2px; margin: 8px 0 10px; }
  .mt-bar i { display: block; }
  .t-win { --t: #13a6aa; } .t-fail { --t: #e5484d; } .t-pending { --t: #7b5cf0; } .t-unknown { --t: #c4ccd4; }
  .mt-bar i { background: var(--t); }
  .mt-legend { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13px; color: var(--text-secondary); margin-bottom: 14px; }
  .mt-legend .lg::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--t); margin-right: 6px; vertical-align: -1px; }
  .mt-legend b { color: var(--text-primary); font-family: var(--head-font); }
  .mt-list { display: flex; flex-direction: column; }
  .mt-row { display: grid; grid-template-columns: 12px 1fr 130px 210px; gap: 14px; align-items: center; padding: 10px 4px; border-top: 1px solid var(--gridline); }
  .mt-row .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--t); }
  .mt-who a { color: var(--text-primary); font-weight: 600; text-decoration: none; } .mt-who a:hover { color: var(--teal-ink); }
  .mt-when { font-size: 13px; font-variant-numeric: tabular-nums; }
  .badge { justify-self: end; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; color: var(--t); background: color-mix(in srgb, var(--t) 13%, transparent); max-width: 210px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge.t-unknown { color: var(--text-secondary); background: var(--gridline); }
  @media (max-width: 700px) { .mt-row { grid-template-columns: 12px 1fr; } .mt-when, .badge { grid-column: 2; justify-self: start; } }
  .lead-stats { display: flex; gap: 22px; margin: 4px 0 6px; }
  .lead-stats div { display: flex; flex-direction: column; } .lead-stats b { font-family: var(--head-font); font-size: 24px; } .lead-stats span { font-size: 12px; color: var(--text-muted); }
  a.chip.win { border-color: #13a6aa; background: color-mix(in srgb, #13a6aa 10%, transparent); }
  .dl-stats { display: flex; flex-wrap: wrap; gap: 14px 30px; margin: 4px 0 4px; }
  .dl-stats div { display: flex; flex-direction: column; } .dl-stats b { font-family: var(--head-font); font-size: 28px; font-weight: 800; letter-spacing: -0.02em; } .dl-stats span { font-size: 12px; color: var(--text-muted); }
  .dl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; max-height: 620px; overflow-y: auto; padding: 2px; }
  .dl-card { display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; border: 1px solid var(--border); border-left: 4px solid var(--c); border-radius: 12px; background: var(--surface-1); text-decoration: none; color: var(--text-primary); transition: border-color .15s, transform .15s; }
  .dl-card:hover { border-color: var(--c); transform: translateY(-1px); }
  .dl-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .dl-pipe { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--c); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dl-name { font-family: var(--head-font); font-weight: 700; font-size: 16px; }
  .dl-card .badge { justify-self: start; align-self: flex-start; max-width: 100%; }

  .ch-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
  .ch-card { border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; border-top: 4px solid var(--c); background: linear-gradient(180deg, color-mix(in srgb, var(--c) 7%, var(--surface-1)), var(--surface-1) 60%); }
  .ch-name { font-family: var(--head-font); font-weight: 800; font-size: 16px; }
  .ch-reach { font-family: var(--head-font); font-size: 28px; font-weight: 800; letter-spacing: -0.02em; margin: 6px 0 10px; }
  .ch-reach span { font-family: "Inter", sans-serif; font-size: 12px; font-weight: 500; color: var(--text-muted); margin-left: 6px; letter-spacing: 0; }
  .ch-card dl { margin: 0; display: grid; gap: 6px; }
  .ch-card dl div { display: flex; justify-content: space-between; font-size: 13px; border-top: 1px dashed var(--border); padding-top: 6px; }
  .ch-card dt { color: var(--text-secondary); } .ch-card dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; }
  .ch-card dd small { font-weight: 500; color: var(--text-muted); }
  .ch-tag { display: inline-block; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; padding: 1px 7px; border-radius: 999px; color: #fff; background: var(--c); margin-right: 4px; }

  .mt-row { grid-template-columns: 1fr 130px 230px; }
  @media (max-width: 700px) { .mt-row { grid-template-columns: 1fr; } .mt-when, .badge { grid-column: 1; } }
  .mt-list { max-height: 640px; overflow-y: auto; }
  .mt-list[data-filter="win"] .mt-row:not([data-tone="win"]), .mt-list[data-filter="fail"] .mt-row:not([data-tone="fail"]),
  .mt-list[data-filter="pending"] .mt-row:not([data-tone="pending"]), .mt-list[data-filter="unknown"] .mt-row:not([data-tone="unknown"]) { display: none; }
  .mt-legend button.lg { font: inherit; font-size: 13px; color: var(--text-secondary); background: none; border: 1px solid transparent; border-radius: 999px; padding: 3px 10px 3px 8px; cursor: pointer; }
  .mt-legend button.lg:hover { border-color: var(--border); }
  .mt-legend button.lg.sel { border-color: var(--t); background: color-mix(in srgb, var(--t) 10%, transparent); color: var(--text-primary); }
  .mt-legend { align-items: center; }

  /* Rep overview pages (23 Nov): per-rep queue + history charts. Chart colours validated with the
     dataviz validator (light vs #fff, dark vs #131b1f): all checks pass; amber has <3:1 contrast on
     light, so every chart also has a legend, tooltips and a table view. */
  :root { --rc-1: #13979b; --rc-2: #7b5cf0; --rc-3: #eda100; --rc-4: #2a78d6; --rc-5: #eb6834; --rc-other: #b6c0c8; }
  @media (prefers-color-scheme: dark) { :root { --rc-1: #1f9fa2; --rc-2: #8a6ff2; --rc-3: #c98500; --rc-4: #3987e5; --rc-5: #d95926; --rc-other: #4a5a63; } }
  .rep-head { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; margin: 6px 0 16px; }
  .rep-head h1 { font-family: var(--head-font); font-size: 24px; margin: 0; }
  .rep-head .sub { color: var(--text-muted); font-size: 13px; margin-top: 4px; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .seg button { background: var(--surface-1); color: var(--text-secondary); border: 0; padding: 7px 14px; font: inherit; font-size: 13px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button.on { background: var(--purple-soft); color: var(--text-primary); font-weight: 600; }
  .rep-chart { position: relative; }
  .rep-chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .rep-chart .grid { stroke: var(--gridline); stroke-width: 1; }
  .rep-chart .base { stroke: var(--baseline); stroke-width: 1; }
  .rep-chart text { fill: var(--text-muted); font-size: 11px; font-family: inherit; }
  .rep-chart .hit { fill: transparent; cursor: default; }
  .rep-chart .hit:hover + g .bar, .rep-chart g.col:hover .bar { opacity: 0.85; }
  .rep-tip { position: absolute; pointer-events: none; background: var(--surface-1); border: 1px solid var(--border); box-shadow: var(--shadow); border-radius: 8px; padding: 8px 10px; font-size: 12px; color: var(--text-primary); white-space: nowrap; z-index: 5; display: none; }
  .rep-tip .t { font-weight: 600; margin-bottom: 4px; }
  .rep-tip .r { display: flex; gap: 8px; align-items: center; color: var(--text-secondary); }
  .rep-tip .r b { color: var(--text-primary); margin-left: auto; font-weight: 600; }
  .sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
  .rep-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--text-secondary); margin: 0 0 12px; }
  .rep-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .rep-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .rep-table th, .rep-table td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); }
  .rep-table th { color: var(--text-muted); font-weight: 600; font-size: 12px; }
  .rep-table td.n, .rep-table th.n { text-align: right; font-variant-numeric: tabular-nums; }
  .rep-table a { color: inherit; }
  .chip-mini { display: inline-block; font-size: 11px; color: var(--text-secondary); background: var(--page-plane); border: 1px solid var(--border); border-radius: 999px; padding: 1px 7px; margin: 0 3px 2px 0; }
  details.tbl { margin-top: 10px; font-size: 12px; overflow-x: auto; } details.tbl summary { cursor: pointer; color: var(--text-muted); }
  .warn-t { color: var(--critical); }

  .rep-card { min-width: 0; max-width: 100%; overflow: hidden; }
  .plan { display: grid; gap: 10px; }
  .slot { display: grid; grid-template-columns: 112px 1fr; gap: 14px; align-items: start; }
  @media (max-width: 700px) { .slot { grid-template-columns: 1fr; gap: 4px; } }
  .slot .tm { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 13px; color: var(--text-secondary); padding-top: 12px; }
  .slot .blk { border: 1px solid var(--border); border-left: 4px solid var(--rc-1); border-radius: 12px; padding: 12px 14px; background: var(--surface-1); min-width: 0; }
  .slot.reengage .blk { border-left-color: var(--rc-2); } .slot.followups .blk { border-left-color: var(--rc-4); }
  .slot.lunch .blk { border-left-color: var(--rc-other); background: transparent; border-style: dashed; color: var(--text-muted); padding: 8px 14px; }
  .slot.now .blk { box-shadow: 0 0 0 2px var(--purple-soft), var(--shadow); }
  .slot .ttl { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-weight: 600; }
  .slot .now-b { font-size: 11px; font-weight: 700; color: var(--purple); background: var(--purple-soft); border-radius: 999px; padding: 2px 8px; }
  .slot .meta { font-size: 12px; color: var(--text-muted); margin: 4px 0 8px; }
  .prog { height: 8px; border-radius: 999px; background: var(--not-done); overflow: hidden; margin: 6px 0 4px; }
  .prog > i { display: block; height: 100%; border-radius: 999px; background: var(--good); }
  .slot details summary { cursor: pointer; font-size: 13px; color: var(--text-secondary); }
  .slot ol { margin: 8px 0 0; padding-left: 22px; font-size: 13px; max-height: 360px; overflow: auto; }
  .slot ol li { padding: 3px 0; border-bottom: 1px solid var(--gridline); }
  .slot ol li .c { color: var(--text-muted); font-size: 12px; }
  .short { font-size: 12px; color: var(--warning); margin-top: 6px; }

  .slot-btns { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
  .slot-btn { display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; font-size: 13px; text-decoration: none; color: var(--text-primary); background: var(--page-plane); }
  a.slot-btn:hover { border-color: var(--purple); }
  .slot-btn b { font-variant-numeric: tabular-nums; min-width: 26px; }
  .slot-btn span { margin-left: auto; color: var(--purple); font-size: 12px; white-space: nowrap; }

  .rr-pill { border: 0; background: transparent; color: var(--text-secondary); white-space: nowrap; font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 8px; cursor: pointer; }
  .rr-pill:hover { color: var(--text-primary); background: var(--gridline); }
  .rr-pill.active { background: var(--text-primary); color: var(--surface-1); }
  .rep-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .rep-controls input[type=date] { font: inherit; font-size: 13px; padding: 5px 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-1); color: var(--text-primary); }
  .rep-controls .upd { background: var(--purple); color: #fff; border: 0; font: inherit; font-weight: 600; font-size: 14px; padding: 8px 16px; border-radius: 10px; cursor: pointer; box-shadow: 0 4px 12px rgba(123,92,240,0.25); }
  .card-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .seg.sm button { padding: 4px 10px; font-size: 12px; } .seg button:disabled { opacity: 0.35; cursor: not-allowed; }
  body[data-sec="acquisition"] { --sec: var(--purple); --sec-ink: var(--purple); --sec-soft: var(--purple-soft); }
  body[data-sec="acquisition"] header { background: linear-gradient(180deg, var(--surface-1), color-mix(in srgb, var(--purple) 5%, var(--surface-1))); }
  #meta-line.stale { color: var(--warning); font-weight: 600; }
</style>
</head>
<body>
<header>
  <div class="brandbar"><span class="mark"></span><a href="/">Growth Reports</a></div>
  <nav id="campaign-nav"></nav>
</header>
<main id="main">Loading…</main>
<div id="contact-popover"></div>

<script>
const SERIES = ["var(--series-1)","var(--series-2)","var(--series-3)","var(--series-4)","var(--series-5)","var(--series-6)","var(--series-7)","var(--series-8)"];
const REPORT_KEY = "mrr-nov-sprint";
const REFERRAL_TAB_KEY = "referral-programme"; // pseudo-campaign key for the Referral programme tab

// Referral programme snapshot — campaign reach by exact UTM, from Mixpanel (page_viewed,
// utm_campaign=...). NOT live: a manually refreshed snapshot, refreshed here periodically.
// (A live wire-up would need the worker to reach BigQuery — a credential + scope task; see
// git history for the downstream-funnel version this replaced, reverted in favour of manually
// cross-checking each campaign's GG user IDs against Count's referred-subs table instead.)
// To refresh: re-run the Mixpanel utm_campaign breakdown and paste the numbers + asOf.
const REFERRALS = {
  reach: {
    asOf: "2026-09-29",
    campaigns: [
      {
        utm: "raf_250_0926",
        label: "one-time outreach · 2 emails",
        rows: [
          { stage: "Unique visitors", users: 11 },
          { stage: "Page views", users: 122 },
        ],
        split: "By email: email01 8 · email02 4 · get-link 1 (email02 still rolling out)",
        // GG user IDs for the identified visitors — paste into Count's referred-subs table
        // (referrer_user_id) to manually check if any of these people's referrals converted.
        // 3 of the 11 unique visitors had no identifiable GG user ID at page-view time.
        userIds: [27955, 16466, 11573, 34973, 223864, 239900, 240383, 28551],
        userIdsNote: "8 of 11 unique visitors identified; 3 unidentified.",
      },
      {
        utm: "raf_0926&utm_source=email",
        label: "always-on · review-triggered — email",
        rows: [
          { stage: "Unique visitors", users: 5 },
          { stage: "Page views", users: 20 },
        ],
        userIds: [146562, 223864, 220277],
        userIdsNote: "3 of 5 unique visitors identified; 2 unidentified.",
      },
      {
        utm: "raf_0926&utm_source=meta&utm_medium=paid_social",
        label: "always-on · review-triggered — ads (Meta, paid social)",
        rows: [
          { stage: "Unique visitors", users: 33 },
          { stage: "Page views", users: 104 },
        ],
        // Every one of these ad-click pageviews (2026-09-29 check) was unauthenticated at
        // page-view time, so there's no GG user ID to list or cross-check in Count yet.
        userIds: [],
        userIdsNote: "0 of 33 unique visitors identified — unauthenticated at page-view time, so not cross-checkable in Count yet.",
      },
    ],
  },
};

function fmtDate(iso) {
  if (!iso) return "";
  return new Date(iso).toLocaleString("en-GB", { day: "numeric", month: "short", year: "numeric" });
}
function fmtDateTime(iso) {
  if (!iso) return "";
  return new Date(iso).toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// Dominant priority per campaign — HubSpot's live hs_task_priority on its tasks, majority
// wins. Recomputed from the same live API pull as everything else, so it (and the sort
// order below) tracks a priority change in HubSpot automatically next time the page loads
// or refreshes — no separate polling needed for the data itself, just a periodic refresh
// (see the auto-refresh interval at the bottom) so an already-open tab picks it up too.
function dominantPriority(proj) {
  const rows = (proj.tasks && proj.tasks.priorityBreakdown) || [];
  return rows[0] ? rows[0].level : "NONE";
}
function priorityRank(level) {
  return { HIGH: 0, MEDIUM: 1, LOW: 2 }[level] ?? 3; // NONE/unset sorts last
}
function sortedByPriority(projects) {
  return [...projects].sort((a, b) => priorityRank(dominantPriority(a)) - priorityRank(dominantPriority(b)));
}
// Campaigns flagged closed: true in _worker.js live under "Closed" — out of the main nav and
// the main landing grid, but still fully viewable.
const isClosed = (p) => !!p.closed;
function closedPillHtml() {
  return `<span class="priority-pill closed">Closed</span>`;
}
function priorityPillHtml(level) {
  const cls = (level || "NONE").toLowerCase();
  const label = !level || level === "NONE" ? "Not set" : level.charAt(0) + level.slice(1).toLowerCase();
  return `<span class="priority-pill ${cls}">${label}</span>`;
}

function priorityTileHtml(breakdown) {
  const rows = breakdown || [];
  if (!rows.length) return `<div class="stat-tile priority"><div class="label">Priority</div><div class="value">—</div></div>`;
  const top = rows[0];
  const cls = (top.level || "").toLowerCase();
  const label = top.level === "NONE" ? "Not set" : (top.level || "").charAt(0) + (top.level || "").slice(1).toLowerCase();
  const mixed = rows.length > 1 ? ` <span style="font-size:11px;color:var(--text-muted);font-weight:400">(mixed — ${rows.map(r => r.level + ' ' + r.count).join(', ')})</span>` : "";
  return `<div class="stat-tile priority ${cls}"><div class="label">Priority</div><div class="value">${label}${mixed}</div></div>`;
}

// Projects run as monthly waves (breakdownBy: "month") get a month table instead of attempts.
function monthTableHtml(byMonth) {
  if (!byMonth || !byMonth.length) return "";
  return `
    <p class="sub" style="margin-top:18px; margin-bottom:10px">Breakdown by month — left to do</p>
    <div class="overflow-x">
      <table class="number-table">
        <thead><tr><th>Month</th><th>Total</th><th>Done</th><th>Left to do</th></tr></thead>
        <tbody>
          ${byMonth.map((m) => `
            <tr>
              <td>${m.month === "?" ? "(no month)" : m.month}</td>
              <td>${m.total}</td>
              <td>${m.done}</td>
              <td class="left-to-do ${m.notDone > 0 ? "has-left" : ""}">${m.notDone}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>`;
}

function callNumberTableHtml(byCallNumber) {
  if (!byCallNumber || !byCallNumber.length) return "";
  return `
    <p class="sub" style="margin-top:18px; margin-bottom:10px">Breakdown by call attempt — left to do</p>
    <div class="overflow-x">
      <table class="number-table">
        <thead><tr><th>Attempt</th><th>Total</th><th>Done</th><th>Left to do</th></tr></thead>
        <tbody>
          ${byCallNumber.map((c) => `
            <tr>
              <td>${c.number === "?" ? "(no number)" : "#" + c.number}</td>
              <td>${c.total}</td>
              <td>${c.done}</td>
              <td class="left-to-do ${c.notDone > 0 ? "has-left" : ""}">${c.notDone}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>`;
}

function hubspotTaskLink(hubspot, viewId, searchTerm) {
  if (!hubspot || !viewId) return null;
  const q = searchTerm ? `?query=${encodeURIComponent(searchTerm)}` : "";
  return `https://${hubspot.subdomain}/contacts/${hubspot.portalId}/objects/${hubspot.objectTypeId}/views/${viewId}/list${q}`;
}

function taskNamePatternHtml(proj) {
  if (!proj.taskNamePattern) return "";
  return `<p class="task-name-pattern">HubSpot task name: <code>${esc(proj.taskNamePattern)}</code> <span class="task-name-note">(call number, e.g. "#1 |", varies)</span></p>`;
}

function completionCardHtml(proj, sprintStart, hubspot) {
  const t = proj.tasks || { total: 0, done: 0, notDone: 0, reps: {}, byCallNumber: [], priorityBreakdown: [] };
  const contextLine = proj.context ? `<p class="context-line">${esc(proj.context)}</p>` : "";
  const namePattern = taskNamePatternHtml(proj);
  if (!t.total) {
    return `
      <section class="card">
        <h2>${esc(proj.label)}</h2>
        <p class="sub">Call task completion — assigned after ${fmtDate(sprintStart)}</p>
        ${contextLine}
        ${namePattern}
        <div class="empty-state">${rangeIsSet() ? `No open tasks ${esc(rangeLabel())}.` : `No matching call tasks yet in this project since ${fmtDate(sprintStart)}.`}</div>
      </section>`;
  }
  // The report's fixed reps are listed even with no tasks; in a date range that leaves "0 / 0" rows.
  const reps = Object.entries(t.reps || {}).filter(([, r]) => r.created || !rangeIsSet());
  window.__repStats = Object.fromEntries(reps);
  return `
    <section class="card">
      <h2>${esc(proj.label)}</h2>
      <p class="sub">Call task completion — assigned after ${fmtDate(sprintStart)}</p>
      ${contextLine}
      ${namePattern}
      ${rangeIsSet() ? `<p class="range-note">Showing ${esc(rangeLabel())}: total = tasks open at some point in that period; done = completed in it; not done = could have been done in it but weren't.</p>` : ""}
      <div class="stat-row">
        <div class="stat-tile"><div class="label">Total tasks</div><div class="value">${t.total}</div></div>
        <div class="stat-tile done"><div class="label">Done</div><div class="value">${t.done}</div></div>
        <div class="stat-tile"><div class="label">Not done</div><div class="value">${t.notDone}</div></div>
      </div>
      ${reps.map(([name, r]) => {
        const link = hubspotTaskLink(hubspot, hubspot && hubspot.ownerViews && hubspot.ownerViews[name], proj.taskViewQuery);
        return `
        <div class="rep-bar-wrap" data-rep="${esc(name)}">
          <div class="rep-bar-head">
            <span>${esc(name)}</span>
            <span>${r.done} / ${r.created} done</span>
          </div>
          <div class="rep-bar"><div class="done-seg" style="width:${r.created ? (100 * r.done / r.created) : 0}%"></div></div>
          ${link ? `<a class="rep-task-link" href="${link}" target="_blank" rel="noopener">Open ${esc(name)}'s tasks in HubSpot →</a>` : ""}
        </div>
      `;
      }).join("")}
      <div class="legend-row">
        <span><span class="legend-swatch" style="background:var(--good)"></span>Done</span>
        <span><span class="legend-swatch" style="background:var(--not-done)"></span>Not done</span>
      </div>
      ${t.byMonth ? monthTableHtml(t.byMonth) : callNumberTableHtml(t.byCallNumber)}
    </section>`;
}

let popoverHideTimer = null;
function showContactPopover(anchorEl, contacts, portalId) {
  clearTimeout(popoverHideTimer);
  const pop = document.getElementById("contact-popover");
  pop.classList.remove("rep-pop");
  const unique = [];
  const seen = new Set();
  for (const c of contacts) { if (!seen.has(c.id)) { seen.add(c.id); unique.push(c); } }
  pop.innerHTML = (unique.length ? `<p class="ph-title">${unique.length} contact${unique.length === 1 ? "" : "s"}</p>` : `<p class="ph-title">Names not available for this row</p>`) +
    unique.slice(0, 40).map(c => `<a href="https://app-eu1.hubspot.com/contacts/${portalId}/record/0-1/${c.id}" target="_blank" rel="noopener">${esc(c.name)}${c.note ? `<span class="ph-note"> — ${esc(c.note)}</span>` : ""}</a>`).join("");
  const rect = anchorEl.getBoundingClientRect();
  pop.style.display = "block";
  const top = Math.min(rect.bottom + 6, window.innerHeight - pop.offsetHeight - 12);
  pop.style.top = Math.max(8, top) + "px";
  pop.style.left = Math.min(rect.left, window.innerWidth - 280) + "px";
}
function scheduleHidePopover() {
  clearTimeout(popoverHideTimer);
  popoverHideTimer = setTimeout(() => { document.getElementById("contact-popover").style.display = "none"; }, 250);
}

// Plain GG user IDs (not HubSpot contacts, so no record link — just listed for pasting into
// Count's referred-subs table to manually cross-check by hand).
function showUserIdPopover(anchorEl, ids, note) {
  clearTimeout(popoverHideTimer);
  const pop = document.getElementById("contact-popover");
  pop.innerHTML = `<p class="ph-title">${ids.length} GG user ID${ids.length === 1 ? "" : "s"}</p>` +
    ids.map((id) => `<span style="display:block; padding:2px 0; font-family: ui-monospace, 'SF Mono', Menlo, monospace;">${esc(String(id))}</span>`).join("") +
    (note ? `<p class="ph-note" style="margin-top:6px">${esc(note)}</p>` : "");
  const rect = anchorEl.getBoundingClientRect();
  pop.style.display = "block";
  const top = Math.min(rect.bottom + 6, window.innerHeight - pop.offsetHeight - 12);
  pop.style.top = Math.max(8, top) + "px";
  pop.style.left = Math.min(rect.left, window.innerWidth - 280) + "px";
}

// A benchmark campaign's share for one outcome ("–" when it never had that outcome).
function benchShare(bench, outcome) {
  const row = (bench.data.dispositions || []).find((x) => x.outcome === outcome);
  return row ? sharePct(row.tasks, bench.data.totalCompleted) : "–";
}

// "<1%" rather than a misleading "0%" for a real but tiny share.
function sharePct(n, total) {
  if (!total) return "–";
  const p = 100 * n / total;
  return n && p < 1 ? "<1%" : `${Math.round(p)}%`;
}

function outcomeCardHtml(label, o, portalId, loading, bench) {
  const rows = (o && o.dispositions) || [];
  if (!rows.length) {
    return `
      <section class="card">
        <h2>Outcomes — ${esc(label)}</h2>
        <p class="sub">Call outcomes — live</p>
        <div class="empty-state">${loading ? "Loading live outcomes for this campaign…" : "No completed call tasks yet in this project. Updates live as tasks are completed."}</div>
      </section>`;
  }
  const max = Math.max(...rows.map(r => r.tasks));
  const html = `
    <section class="card">
      <h2>Outcomes — ${esc(label)}</h2>
      ${o.snapshotAt
        ? `<p class="sub">Call outcomes — snapshot as of ${fmtDate(o.snapshotAt)}, not live. All completed tasks, whatever the date range.</p>`
        : `<p class="sub">Call outcomes — live${rangeIsSet() ? `, tasks completed ${esc(rangeLabel())}` : ""}. Hover an outcome to see who's behind it, click a name to open them in HubSpot.</p>`}
      ${rows.map((r, i) => `
        <div class="outcome-bar-row" data-outcome-index="${i}">
          <span class="name" data-outcome-index="${i}">${esc(r.outcome)}</span>
          <div class="track"><div class="fill" style="width:${100 * r.tasks / max}%; background:${SERIES[i % SERIES.length]}"></div></div>
            <span class="count">${r.tasks}<span class="share">${sharePct(r.tasks, o.totalCompleted)}</span></span>
          ${bench ? `<span class="bench" title="${esc(bench.label)}: share of its completed tasks">${benchShare(bench, r.outcome)}</span>` : ""}
        </div>
      `).join("")}
      <p class="sub" style="margin-top:12px">${o.totalMatchedToCall} of ${o.totalCompleted} completed tasks matched to a call.${bench ? ` Right-hand column: the same outcome's share in ${esc(bench.label)} (${bench.data.totalCompleted} completed tasks${bench.data.snapshotAt ? `, snapshot ${fmtDate(bench.data.snapshotAt)}` : ""}).` : ""}</p>
      ${o.snapshotAt ? `<p class="sub" style="font-size:11px">${esc(o.snapshotSource || "")}</p>` : ""}
    </section>`;
  // Stash rows on a data attribute-free closure via a global lookup keyed by label (simple,
  // avoids re-parsing HTML to find contacts on hover).
  window.__outcomeRowsByLabel = window.__outcomeRowsByLabel || {};
  window.__outcomeRowsByLabel[label] = rows;
  return html;
}

function wireOutcomeHovers(label, portalId) {
  const rows = (window.__outcomeRowsByLabel || {})[label] || [];
  document.querySelectorAll(`.outcome-bar-row[data-outcome-index], .name[data-outcome-index]`).forEach((el) => {
    const idx = Number(el.getAttribute("data-outcome-index"));
    const row = rows[idx];
    if (!row) return;
    el.addEventListener("mouseenter", () => showContactPopover(el, row.contacts || [], portalId));
    el.addEventListener("mouseleave", scheduleHidePopover);
  });
  const pop = document.getElementById("contact-popover");
  pop.addEventListener("mouseenter", () => clearTimeout(popoverHideTimer));
  pop.addEventListener("mouseleave", scheduleHidePopover);
}

// Meetings booked from this campaign (from /api/outcomes, enrollment-matched campaigns only):
// has each one happened yet, and how did it go.
function meetingsCardHtml(label, o, portalId, loading) {
  if (loading) {
    return `<section class="card"><h2>Meetings — ${esc(label)}</h2><div class="empty-state">Loading meetings…</div></section>`;
  }
  const rows = o && o.meetings;
  if (!rows) return ""; // campaign doesn't use enrollment matching — no meeting data
  const viaEmail = rows.some((r) => r.fromEmail);
  const sub = viaEmail
    ? `Meetings booked from this campaign${rangeIsSet() ? ` ${esc(rangeLabel())} (by the date they were booked)` : ""}: the ones credited to a call task, plus every meeting booked straight from the campaign email's booking link, with or without a call. Whether they've happened yet and how they went. Click a name to open them in HubSpot.`
    : `Meetings booked from this campaign${rangeIsSet() ? ` ${esc(rangeLabel())} (by the date they were booked)` : ""} — whether they've happened yet and how they went. Click a name to open them in HubSpot.`;
  if (!rows.length) {
    return `<section class="card"><h2>Meetings — ${esc(label)}</h2><p class="sub">${sub}</p><div class="empty-state">No meetings booked from this campaign yet.</div></section>`;
  }
  const n = (f) => rows.filter(f).length;
  const tiles = [
    ...(viaEmail
      ? [["Booked", rows.length, ""], ["From email", n(r => r.fromEmail), ""], ["By rep", n(r => !r.fromEmail), ""]]
      : [["Booked (call tasks)", rows.length, ""]]),
    ["Upcoming", n(r => r.status === "Upcoming"), ""],
    ["Happened", n(r => r.status === "Happened"), ""],
    ["Positive", n(r => r.tone === "positive"), "done"],
    ["Negative / no-show", n(r => r.tone === "negative"), "neg"],
    ["No outcome logged", n(r => r.status === "Happened" && r.result === "No outcome logged"), "warn"],
  ];
  const statusOrder = { Upcoming: 0, Happened: 1, "No-show": 2, Cancelled: 3 };
  const sorted = [...rows].sort((a, b) => (statusOrder[a.status] - statusOrder[b.status]) || (a.status === "Upcoming"
    ? (a.startTime || "").localeCompare(b.startTime || "") : (b.startTime || "").localeCompare(a.startTime || "")));
  return `
    <section class="card">
      <h2>Meetings — ${esc(label)}</h2>
      <p class="sub">${sub}</p>
      <div class="stat-row">${tiles.map(([l, v, c]) => `<div class="stat-tile ${c}"><div class="label">${l}</div><div class="value">${v}</div></div>`).join("")}</div>
      <div class="mtg-table-wrap"><table class="mtg-table">
        <thead><tr><th>Contact</th><th>Call</th><th>Meeting</th><th>With</th><th>Booked</th><th>When</th><th>Status</th><th>Result</th></tr></thead>
        <tbody>${sorted.map(r => `
          <tr>
            <td><a href="https://app-eu1.hubspot.com/contacts/${portalId}/record/0-1/${r.contactId}" target="_blank" rel="noopener">${esc(r.name)}</a></td>
            <td class="muted nowrap">${r.callNo ? `#${esc(r.callNo)}` : "—"}${r.fromEmail ? `<div class="ph-note">from email</div>` : ""}</td>
            <td class="muted">${esc(r.title)}</td>
            <td>${esc(r.host || "—")}</td>
            <td class="nowrap muted">${r.bookedAt ? fmtDateTime(r.bookedAt) : "—"}</td>
            <td class="nowrap">${r.startTime ? fmtDateTime(r.startTime) : "—"}</td>
            <td><span class="mtg-status s-${esc(r.status.toLowerCase().replace(/[^a-z]/g, ""))}">${esc(r.status)}</span></td>
            <td class="mtg-result t-${esc(r.tone)}">${esc(r.status === "Upcoming" ? "—" : r.result)}</td>
          </tr>`).join("")}
        </tbody>
      </table></div>
      <p class="sub" style="margin-top:12px">Result for meetings that happened: closed-won Plans deal &gt; any deal opened since booking &gt; the latest call logged after the meeting (Positive / Progress to deal / Thinking about it = positive; Uninterested / Not a fit / Wrong number = negative) &gt; "No outcome logged".</p>
    </section>`;
}

// Bottom of each campaign page: the HubSpot workflows and emails behind it, with links.
function assetsCardHtml(a, loading) {
  const head = `<h2>Workflows &amp; emails</h2><p class="sub">What runs this campaign in HubSpot — click to open.</p>`;
  if (loading) return `<section class="card">${head}<div class="empty-state">Loading…</div></section>`;
  if (!a || a.error) return `<section class="card">${head}<div class="empty-state">Couldn't load workflows and emails.</div></section>`;
  const wf = a.workflows || [], em = a.emails || [];
  const pill = (on) => on == null ? "" : `<span class="mtg-status ${on ? "s-happened" : "s-cancelled"}">${on ? "On" : "Off"}</span>`;
  return `<section class="card">${head}

function dealCardHtml(label, d, portalId, loading) {
  const rows = (d && d.rows) || [];
  const head = `<h2>Plans conversions — ${esc(label)}</h2>`;
  if (!rows.length) {
    return `<section class="card">${head}
        <div class="empty-state">${loading ? "Loading…" : "No contacts from this sequence yet."}</div>
      </section>`;
  }
  const contactLink = (id) => `https://app-eu1.hubspot.com/contacts/${portalId}/record/0-1/${id}`;
  const dealLink = (id) => `https://app-eu1.hubspot.com/contacts/${portalId}/record/0-3/${id}`;
  const fmt = (ms) => ms ? new Date(ms).toLocaleDateString("en-GB", { day: "numeric", month: "short" }) : "";
  const isMig = (r) => /^Migrated/.test(r.label);
  const isNone = (r) => /^\(no closed/.test(r.label);
  const wonRows = rows.filter((r) => !isMig(r) && !isNone(r));
  const migRows = rows.filter(isMig);
  const won = wonRows.reduce((n, r) => n + r.count, 0);
  const migrated = migRows.reduce((n, r) => n + r.count, 0);
  const act = (d.dealActivity && d.dealActivity.deals) || [];
  const inProgress = act.filter((x) => x.status === "open");
  const lost = act.filter((x) => x.status === "lost");
  const converted = d.contactsWithClosedDeal || 0;
  const pct = !d.totalContacts ? 0 : (converted && 100 * converted < d.totalContacts ? "<1" : Math.round(100 * converted / d.totalContacts));

  const list = [
    ...wonRows.flatMap((r) => (r.contacts || []).map((c) => ({ who: c, href: contactLink(c.id), result: "Won", tone: "s-happened", detail: r.label, ms: c.at }))),
    ...migRows.flatMap((r) => (r.contacts || []).map((c) => ({ who: c, href: contactLink(c.id), result: "Migrated", tone: "s-happened", detail: r.label.replace(/^Migrated to /, "").replace(/^(\w+) \((.*)\)$/, "$1 — $2"), ms: c.at }))),
    ...inProgress.map((x) => ({ who: { name: x.contactName || x.name }, href: dealLink(x.id), result: "In progress", tone: "", detail: x.stage || "", ms: x.createdMs })),
    ...lost.map((x) => ({ who: { name: x.contactName || x.name }, href: dealLink(x.id), result: "Lost", tone: "s-cancelled", detail: x.stage || "", ms: x.createdMs })),
  ];
  const tiles = [
    ["Contacts in sequence", d.totalContacts, ""],
    ["Plans won", won, "done"],
    ["Migrated to a plan", migrated, "done"],
    ["Deals in progress", inProgress.length, ""],
    ...(lost.length ? [["Deals lost", lost.length, "neg"]] : []),
  ];
  return `
    <section class="card">
      ${head}
      <p class="sub">${d.snapshotAt ? `Snapshot as of ${fmtDate(d.snapshotAt)}` : "Live"}${rangeIsSet() ? `, ${esc(rangeLabel())}` : ""}. Only counts after the contact was put into this sequence.</p>
      <div class="stat-row">${tiles.map(([l, v, c]) => `<div class="stat-tile ${c}"><div class="label">${l}</div><div class="value">${v}</div></div>`).join("")}</div>
      <p class="sub" style="margin-top:10px"><b>${converted} of ${d.totalContacts} converted (${pct}%)</b> — ${won} won a Plans deal${migrated ? `, ${migrated} migrated (migrations don't create a deal)` : ""}.${inProgress.length ? ` ${inProgress.length} Plans deal${inProgress.length === 1 ? "" : "s"} still open.` : ""}</p>
      ${list.length ? `<div class="mtg-table-wrap"><table class="mtg-table">
        <thead><tr><th>Contact</th><th>Result</th><th>Plan / stage</th><th>Date</th></tr></thead>
        <tbody>${list.map((r) => `<tr>
          <td><a href="${r.href}" target="_blank" rel="noopener">${esc(r.who.name || "(no name)")}</a></td>
          <td><span class="mtg-status ${r.tone}">${r.result}</span></td>
          <td class="muted">${esc(r.detail)}</td>
          <td class="nowrap">${fmt(r.ms)}</td></tr>`).join("")}
        </tbody></table></div>
      <p class="sub" style="margin-top:8px">Won / migrated = date closed. In progress / lost = date the deal was opened.</p>` : ""}
    </section>`;
}

// Experiments with segmentBy (e.g. EPC list by epc_bucket): one row per segment, joining the
// deals card's contacts/conversions with the outcomes card's per-task results.
function segmentCardHtml(o, d, loading) {
  const seg = (d && d.segments) || (o && o.segments);
  if (!seg) return "";
  if (loading && !(d && d.segments && o && o.segments)) {
    return `
      <section class="card">
        <h2>By ${esc(seg.label)}</h2>
        <div class="empty-state">Loading the ${esc(seg.label)} breakdown…</div>
      </section>`;
  }
  const byValue = (s) => Object.fromEntries(((s && s.rows) || []).map(r => [r.value, r]));
  const dRows = byValue(d && d.segments), oRows = byValue(o && o.segments);
  const values = [...new Set([...((d && d.segments && d.segments.rows) || []), ...((o && o.segments && o.segments.rows) || [])].map(r => r.value))];
  const n = (v) => v || 0;
  const pct = (a, b) => (b ? `${Math.round(100 * a / b)}%` : "–");
  return `
    <section class="card">
      <h2>By ${esc(seg.label)}</h2>
      <p class="sub">Same rules as the outcomes and deal cards above, split by the contact's <code>${esc(seg.property)}</code> — live. Spoke to = answered call, meeting or closed won; positive = a Positive or Progress to deal call.</p>
      <div class="overflow-x">
        <table class="outcomes-table">
          <thead><tr><th>${esc(seg.label)}</th><th>Contacts</th><th>Closed won</th><th>Conversion</th><th>Tasks done</th><th>Spoke to</th><th>Positive</th><th>Meetings</th></tr></thead>
          <tbody>
            ${values.map(v => {
              const dr = dRows[v] || {}, or = oRows[v] || {};
              return `<tr><td>${esc(v)}</td><td>${n(dr.contacts)}</td><td>${n(dr.closedWon)}</td><td>${pct(n(dr.closedWon), n(dr.contacts))}</td><td>${n(or.tasksDone)}</td><td>${n(or.spokeTo)}</td><td>${n(or.positive)}</td><td>${n(or.meetings)}</td></tr>`;
            }).join("")}
          </tbody>
        </table>
      </div>
      ${segmentEmailTableHtml(d && d.segments, values, dRows)}
    </section>`;
}

// Email engagement per segment (deals endpoint, projects whose campaign email has send ids).
// Rates are out of delivered when HubSpot's email events could be read, else out of contacts.
function segmentEmailTableHtml(seg, values, dRows) {
  if (!seg || !seg.emailSource) return "";
  const exact = seg.emailSource === "events";
  const n = (v) => v || 0;
  const cell = (a, b) => (b ? `${a} <span style="color:var(--text-muted)">(${Math.round(100 * a / b)}%)</span>` : `${a}`);
  return `
      <h3 style="margin:18px 0 4px; font-size:14px">Campaign email</h3>
      <p class="sub">${exact
        ? "From HubSpot's email events for this email — opened = % of delivered, CTR = clicks ÷ opens."
        : "HubSpot's email events couldn't be read, so opens and clicks use each contact's last marketing email open/click date since enrolling — this can include a different marketing email. % of contacts."}
        Replied = an email back from the contact with this subject, logged in HubSpot.</p>
      <div class="overflow-x">
        <table class="outcomes-table">
          <thead><tr><th>${esc(seg.label)}</th>${exact ? "<th>Delivered</th>" : ""}<th>Opened</th><th>CTR</th><th>Replied</th></tr></thead>
          <tbody>
            ${values.map(v => {
              const r = dRows[v] || {};
              const base = exact ? n(r.delivered) : n(r.contacts);
              return `<tr><td>${esc(v)}</td>${exact ? `<td>${n(r.delivered)}</td>` : ""}<td>${cell(n(r.opened), base)}</td><td>${cell(n(r.clicked), n(r.opened))}</td><td>${cell(n(r.replied), base)}</td></tr>`;
            }).join("")}
          </tbody>
        </table>
      </div>`;
}

// The emails this campaign's workflow sends alongside its call tasks (/api/emails), so a strong
// open rate can be read next to the subject and copy behind it. Rates are % of delivered.
function emailsCardHtml(res, loading) {
  const head = `<h2>Campaign emails</h2>
      <p class="sub">The email${res && res.emails && res.emails.length === 1 ? "" : "s"} sent with this campaign's call tasks — HubSpot's live counts for each email, % of delivered.</p>`;
  if (!res || !res.emails) {
    return `<section class="card">${head}<div class="empty-state">${loading ? "Loading campaign emails…" : "Couldn't load the campaign emails."}</div></section>`;
  }
  const pct = (a, b) => (b ? ` <span class="share">${Math.round(100 * a / b)}%</span>` : "");
  return `
    <section class="card">${head}
      ${res.emails.map(e => {
        const title = esc(e.label || e.name || `Email ${e.id}`);
        const open = `<a href="${esc(e.link)}" target="_blank" rel="noopener">Open in HubSpot ↗</a>`;
        if (e.error) {
          return `<div class="email-block"><div class="email-title">${title} · ${open}</div>
            <p class="sub" style="margin:4px 0 0">Couldn't read this email from HubSpot (the app token may be missing the <code>content</code> scope).</p></div>`;
        }
        const st = e.stats || {};
        return `<div class="email-block">
          <div class="email-title">${title}${e.label && e.name ? ` <span class="email-name">${esc(e.name)}</span>` : ""} · ${open}</div>
          <div class="email-subject">${esc(e.subject || "(no subject)")}</div>
          ${e.previewText ? `<div class="email-preview">${esc(e.previewText)}</div>` : ""}
          <div class="email-stats">
            <span><b>${st.delivered || 0}</b> delivered</span>
            <span><b>${st.opened || 0}</b> opened${pct(st.opened || 0, st.delivered)}</span>
            <span><b>${st.opened ? Math.round(100 * (st.clicked || 0) / st.opened) + "%" : "–"}</b> CTR <span class="share">${st.clicked || 0} clicks</span></span>
            ${st.replied ? `<span><b>${st.replied}</b> replied${pct(st.replied, st.delivered)}</span>` : ""}
            ${st.unsubscribed ? `<span><b>${st.unsubscribed}</b> unsubscribed${pct(st.unsubscribed, st.delivered)}</span>` : ""}
          </div>
          ${e.body ? `<details class="email-body"><summary>Read the email</summary><div>${esc(e.body)}</div></details>` : ""}
        </div>`;
      }).join("")}
    </section>`;
}

// The reach section's row renderer — the "Unique visitors" row becomes hoverable when this
// campaign has identified GG user IDs — see showUserIdPopover/wireReachHovers.
function reachRowsHtml(idx, steps, userIds) {
  const max = Math.max(1, ...steps.map((s) => s.users));
  const hoverable = !!(userIds && userIds.length);
  return steps.map((s, i) => {
    const attrs = (hoverable && s.stage === "Unique visitors")
      ? ` data-reach-idx="${idx}" style="cursor:help; border-bottom:1px dotted var(--text-muted)"` : "";
    return `
    <div class="outcome-bar-row">
      <span class="name" title="${esc(s.stage)}"${attrs}>${esc(s.stage)}</span>
      <div class="track"><div class="fill" style="width:${Math.max(2, Math.round(100 * s.users / max))}%; background:${SERIES[i % SERIES.length]}"></div></div>
      <span class="count"${attrs}>${s.users.toLocaleString()}</span>
    </div>`;
  }).join("");
}

function wireReachHovers(campaigns) {
  document.querySelectorAll("[data-reach-idx]").forEach((el) => {

    el.addEventListener("mouseenter", () => showUserIdPopover(el, c.userIds, c.userIdsNote));
    el.addEventListener("mouseleave", scheduleHidePopover);
  });
}
