  return { data: undefined, loading: true };
}

async function fetchData() {
  // Outcomes/deals aren't fetched for every campaign at once any more (that was ~130 HubSpot
  // calls and 30s+): each campaign page fetches its own, scoped, via resolveScoped/fetchScoped.
  const [statsRes, referralsRes] = await Promise.all([
    fetch(`/api/stats?report=${REPORT_KEY}`).then(r => r.json()),
    fetch(`/api/referrals`).then(r => r.json()).catch(() => null),
  ]);
  cache = { stats: statsRes, outcomes: null, deals: null, referrals: referralsRes };
  // Keep the last good load for this tab, so coming back (e.g. the back button from another
  // report) can paint instantly instead of waiting on the live HubSpot fetch again.
  try { sessionStorage.setItem(lastLoadKey(), JSON.stringify(cache)); } catch (_) { /* quota / disabled */ }
}
// Data is always all-time (the date range is applied in the browser), so one saved load per tab.
const LAST_LOAD_PREFIX = "beth-reports:last-load-v3";
const lastLoadKey = () => LAST_LOAD_PREFIX;

function render() {
  const key = currentCampaignKey();
  const { outcomes: outcomesRes, deals: dealsRes } = cache;
  const statsRes = withMergedProjects(sliceStats(cache.stats));
  if (!statsRes) return;

  renderNav(statsRes, key);
  const main = document.getElementById("main");
  main.classList.toggle("calls-view", new URLSearchParams(location.search).get("view") === "calls");

  const repSel = REPS.find((r) => r.key === currentRepKey());
  if (repSel) {
    // Redraw the shell whenever the rep changes (it used to keep the previous rep's page until data came back).
    if (!document.getElementById("rep-tiles") || main.dataset.rep !== repSel.key) { main.innerHTML = repPageHtml(repSel); main.dataset.rep = repSel.key; }
    loadRep(repSel);
    return;
  }
  delete main.dataset.rep;
  const secParam = ((s) => s === "reports" ? "campaigns" : s)(new URLSearchParams(location.search).get("section"));
  const iniKey = currentInitiativeKey();
  const ini = iniKey && initiativesList(statsRes).find((x) => x.key === iniKey);
  if (!key && ini) {
    main.innerHTML = initiativePageHtml(statsRes, ini);
  } else if (!key && secParam && SECTIONS.some((x) => x.key === secParam)) {
    main.innerHTML = sectionPageHtml(statsRes, secParam);
  } else if (!key) {
    main.innerHTML = landingHtml(statsRes);
  } else if (key === REFERRAL_TAB_KEY) {
    main.innerHTML = referralPageHtml();
    wireReachHovers(REFERRALS.reach.campaigns);
  } else {
    const proj = (statsRes.projects || []).find(p => p.key === key);
    if (!proj) {
      main.innerHTML = `<div class="empty-state">Unknown campaign "${esc(key)}". <a href="/">Back to all campaigns</a>.</div>`;
      return;
    }
    main.innerHTML = campaignPageHtml(proj, statsRes.sprintStart, statsRes.hubspot);
    const portalId = (outcomesRes && outcomesRes.portalId) || (dealsRes && dealsRes.portalId) || "25516403";

    const outcomesByKey = Object.fromEntries((outcomesRes && outcomesRes.projects || []).map(p => [p.key, p]));
    const { data: outcomeAll, loading: outcomesLoading } = resolveScoped("outcomes", key, outcomesByKey);
    const outcomeData = sliceOutcomes(outcomeAll);
    const benchCfg = OUTCOME_BENCHMARKS[key];
    const benchRes = benchCfg ? resolveScoped("outcomes", benchCfg.key, outcomesByKey) : null;
    const bench = benchRes && benchRes.data ? { label: benchCfg.label, data: benchRes.data } : null;
    document.getElementById("outcomes-slot").innerHTML = outcomeCardHtml(proj.label, outcomeData, portalId, outcomesLoading, bench);
    wireOutcomeHovers(proj.label, portalId);
    window.__repOutcomes = outcomesLoading ? undefined : ((outcomeData && outcomeData.byRep) || {});
    wireRepHovers();

    document.getElementById("meetings-slot").innerHTML = meetingsCardHtml(proj.label, outcomeData, portalId, outcomesLoading);

    const dealsByKey = Object.fromEntries((dealsRes && dealsRes.projects || []).map(p => [p.key, p]));
    const { data: dealAll, loading: dealsLoading } = resolveScoped("deals", key, dealsByKey);
    const dealData = sliceDeals(dealAll);
    document.getElementById("deals-slot").innerHTML = dealCardHtml(proj.label, dealData, portalId, dealsLoading);
    wireDealHovers(proj.label, portalId);

    if (proj.hasEmails) {
      if (!(key in campaignEmailsByKey)) {
        campaignEmailsByKey[key] = undefined;
        fetch(`/api/emails?report=${REPORT_KEY}&campaign=${encodeURIComponent(key)}`).then(r => r.json()).catch(() => null)
          .then(res => { campaignEmailsByKey[key] = res; if (currentCampaignKey() === key) render(); });
      }
      document.getElementById("emails-slot").innerHTML = emailsCardHtml(campaignEmailsByKey[key], campaignEmailsByKey[key] === undefined);
    }

    document.getElementById("segments-slot").innerHTML = segmentCardHtml(outcomeData, dealData, outcomesLoading || dealsLoading);

    if (!(key in campaignAssetsByKey)) {
      campaignAssetsByKey[key] = undefined;
      fetch(`/api/assets?report=${REPORT_KEY}&campaign=${encodeURIComponent(key)}`).then(r => r.json()).catch(() => null)
        .then(res => { campaignAssetsByKey[key] = res; if (currentCampaignKey() === key) { const el = document.getElementById("assets-slot"); if (el) el.innerHTML = assetsCardHtml(res, false); } });
    }
    document.getElementById("assets-slot").innerHTML = assetsCardHtml(campaignAssetsByKey[key], campaignAssetsByKey[key] === undefined);
  }

  const metaLine = document.getElementById("meta-line");
  if (metaLine) {
    metaLine.textContent = key === REFERRAL_TAB_KEY
      ? "Referral programme"
      : refreshingSaved
        ? `Showing saved data from ${fmtDateTime(statsRes.generatedAt)} · refreshing from HubSpot…`
        : `${statsRes.name || "MRR Nov Sprint"} · live, updated ${fmtDateTime(statsRes.generatedAt)}`;
    metaLine.classList.toggle("stale", !!refreshingSaved && key !== REFERRAL_TAB_KEY);
  }
  const other = statsRes.other || { total: 0 };
  const footer = document.getElementById("footer-line");
  if (footer) {
    footer.textContent = (key !== REFERRAL_TAB_KEY && other.total)
      ? `${other.total} matching task${other.total === 1 ? "" : "s"} didn't fit any known project's title pattern and aren't shown.`
      : "";
  }
  const updateBtn = document.getElementById("update-btn");
  if (updateBtn) {
    updateBtn.textContent = scopedRefreshing.size ? "Updating…" : "Update";
    updateBtn.addEventListener("click", () => load({ force: true }));
  }
  wireRangeControl();
}

// True while the page is showing the last saved load and the live refresh is still running.
let refreshingSaved = false;
async function load({ force = false } = {}) {
  // Rep tabs (e.g. Billy) don't need the main /api/stats load at all: paint the page straight
  // away and fetch only that rep's endpoints. Counts on the other tabs come from this tab's last
  // saved load if there is one, otherwise they're left off until you visit those tabs.
  const repOnly = REPS.find((r) => r.key === currentRepKey());
  if (repOnly) {
    if (force) { repCache.queue = {}; repCache.activity = {}; repCache.plan = {}; }
    let st = cache.stats;
    if (!st) { try { const saved = JSON.parse(sessionStorage.getItem(lastLoadKey()) || "null"); if (saved && saved.stats) { cache = saved; st = saved.stats; } } catch (_) {} }
    renderNav(st ? withMergedProjects(sliceStats(st)) : { projects: [], noStats: true }, null);
    const main = document.getElementById("main");
    // Redraw the shell whenever the rep changes (it used to keep the previous rep's page until data came back).
    if (!document.getElementById("rep-tiles") || main.dataset.rep !== repOnly.key) { main.innerHTML = repPageHtml(repOnly); main.dataset.rep = repOnly.key; }
    loadRep(repOnly);
    return;
  }
  try {
    if (!force && !cache.stats) {
      // Paint the previous load straight away (if this tab has one), then refresh it below.
      try {
        const saved = JSON.parse(sessionStorage.getItem(lastLoadKey()) || "null");
        if (saved && saved.stats) { cache = saved; refreshingSaved = true; render(); force = true; }
      } catch (_) { /* unreadable — fall through to a normal load */ }
    }
    const key = currentCampaignKey();
    if (force && key && key !== REFERRAL_TAB_KEY) {
      // Update = the whole page: tasks (stats), outcomes, meetings, deals, emails, workflows.
      // Each card keeps its current numbers until its fresh data lands, then redraws.
      const parts = (MERGED_CAMPAIGNS[key] ? MERGED_CAMPAIGNS[key].parts : [key]).concat(OUTCOME_BENCHMARKS[key] ? [OUTCOME_BENCHMARKS[key].key] : []);
      for (const k of parts) { fetchScoped("outcomes", k); fetchScoped("deals", k); }
      delete campaignEmailsByKey[key];
      delete campaignAssetsByKey[key];
    }
    if (force) { initEmails = {}; initWeb = {}; }
    if (force || !cache.stats) {
      const btn = document.getElementById("update-btn");
      if (force && btn) btn.textContent = "Updating…";
      await fetchData();
    }
    refreshingSaved = false;
    render();
  } catch (e) {
    refreshingSaved = false;
    document.getElementById("main").innerHTML = `<div class="empty-state">Failed to load — ${esc(String(e))}</div>`;
  }
}

// Intercept in-app link clicks for snappier nav (no full reload), fall back to normal
// navigation for anything external or with modifier keys held.
document.addEventListener("click", (e) => {
  const a = e.target.closest("a");
  if (!a) return;
  const url = new URL(a.href, location.href);
  if (url.origin !== location.origin) return;
  // Only the home page's own tabs (/ and /?campaign=…) are rendered in place. Other reports
  // (/meetings-booked/, /btl-calculator-page/, /black-friday-pages/) are separate pages and must navigate normally,
  // or the back button returns to a half-rendered home page.
  if (url.pathname !== "/") return;
  if (e.metaKey || e.ctrlKey || e.shiftKey || a.target === "_blank") return;
  e.preventDefault();
  history.pushState({}, "", url.pathname + url.search);
  navRender();
});
// The Billy tab can be opened without the main stats load; leaving it for a tab that needs them
// triggers that load instead of rendering an empty page.
const navRender = () => (cache.stats || REPS.some((r) => r.key === currentRepKey()) ? (REPS.some((r) => r.key === currentRepKey()) ? load() : render()) : load());
window.addEventListener("popstate", navRender);
// Restored from the back/forward cache mid-load: finish loading rather than sit on "Loading…".
window.addEventListener("pageshow", (e) => { if (e.persisted && !cache.stats) load(); });

// Periodic background refresh so an already-open tab picks up a HubSpot change (priority,
// new/completed tasks) without someone having to remember to click Update.
setInterval(() => { if (document.visibilityState === "visible") load({ force: true }); }, 5 * 60 * 1000);

load();
</script>
